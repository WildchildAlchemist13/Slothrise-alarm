<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0B1A; color: #FBF7FF; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; position: relative; overflow: hidden;">
  <div style="position: absolute; width: 320px; height: 320px; border-radius: 50%; right: -140px; top: -120px; background: #3EE6B0; filter: blur(80px); opacity: 0.35;"></div>
  <div style="position: relative; padding: 60px 18px 0; display: flex; flex-direction: column; gap: 14px;">

      <span style="font-size: 13px; color: #B7AECF; font-weight: 700;">Thursday</span>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: 24px; background: #1E1638; border: 1px solid rgba(255,255,255,0.1);">
      <svg width="92" height="92" viewBox="0 0 100 100" role="img" aria-label="2 of 5 habits done" style="flex: none;">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3EE6B0"></stop><stop offset="1" stop-color="#FFD93D"></stop></linearGradient></defs>
        <circle cx="50" cy="50" r="40" fill="none" stroke="#272043" stroke-width="10"></circle>
        <circle cx="50" cy="50" r="40" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="150.8" transform="rotate(-90 50 50)"></circle>
        <text x="50" y="58" text-anchor="middle" fill="#FBF7FF" style="font-family: 'Fredoka', sans-serif; font-weight: 800; font-size: 24px;">2/5</text>

      <div style="display: flex; flex-direction: column; gap: 2px;">
        <b style="font-family: 'Fredoka', sans-serif; font-size: 21px; letter-spacing: -0.02em;">Nice, keep rolling</b>
        <span style="font-size: 13.5px; color: #B7AECF;">3 to go. Finish all 5 for a bonus streak day.</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 18px; background: rgba(62,230,176,0.1); border: 1px solid rgba(62,230,176,0.45);">
        <button type="button" aria-pressed="true" aria-label="Big glass of water, done" style="width: 42px; height: 42px; border-radius: 14px; border: 0; background: #3EE6B0; color: #1B0F24; display: grid; place-items: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button>
        <div style="flex: 1; min-width: 0;"><b style="font-size: 15px;">Big glass of water</b><div style="display: flex; gap: 4px; margin-top: 5px;"><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i></div></div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 800; color: #FF8A3D;">4 days</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 18px; background: rgba(62,230,176,0.1); border: 1px solid rgba(62,230,176,0.45);">
        <button type="button" aria-pressed="true" aria-label="Write 300 words, done" style="width: 42px; height: 42px; border-radius: 14px; border: 0; background: #3EE6B0; color: #1B0F24; display: grid; place-items: center; flex: none;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></button>
        <div style="flex: 1; min-width: 0;"><b style="font-size: 15px;">Write 300 words</b><div style="display: flex; gap: 4px; margin-top: 5px;"><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i></div></div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 800; color: #FF8A3D;">13 days</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 18px; background: #1A1530; border: 1px solid rgba(255,255,255,0.1);">
        <button type="button" aria-pressed="false" aria-label="Make the bed" style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid #3A3160; background: #272043; flex: none;"></button>
        <div style="flex: 1; min-width: 0;"><b style="font-size: 15px;">Make the bed</b><div style="display: flex; gap: 4px; margin-top: 5px;"><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043; outline: 1.5px solid #B7AECF; outline-offset: 1px;"></i></div></div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 800; color: #FF8A3D;">4 days</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 18px; background: #1A1530; border: 1px solid rgba(255,255,255,0.1);">
        <button type="button" aria-pressed="false" aria-label="10 minute stretch" style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid #3A3160; background: #272043; flex: none;"></button>
        <div style="flex: 1; min-width: 0;"><b style="font-size: 15px;">10 min stretch</b><div style="display: flex; gap: 4px; margin-top: 5px;"><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043; outline: 1.5px solid #B7AECF; outline-offset: 1px;"></i></div></div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 800; color: #FF8A3D;">1 day</span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 18px; background: #1A1530; border: 1px solid rgba(255,255,255,0.1);">
        <button type="button" aria-pressed="false" aria-label="No phone for 20 minutes" style="width: 42px; height: 42px; border-radius: 14px; border: 2px solid #3A3160; background: #272043; flex: none;"></button>
        <div style="flex: 1; min-width: 0;"><b style="font-size: 15px;">No phone for 20 min</b><div style="display: flex; gap: 4px; margin-top: 5px;"><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #3EE6B0;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043;"></i><i style="width: 10px; height: 10px; border-radius: 3px; background: #272043; outline: 1.5px solid #B7AECF; outline-offset: 1px;"></i></div></div>
        <span style="font-family: 'Fredoka', sans-serif; font-weight: 800; color: #B7AECF;">0</span>
      </div>
    </div>

    <form style="display: flex; gap: 8px; margin: 0;">
      <label for="newHabit" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">New habit</label>
      <input id="newHabit" placeholder="Add a habit, like “Read 10 pages”" style="flex: 1; min-width: 0; background: #272043; border: 0; border-radius: 14px; padding: 12px 14px; font: inherit; font-weight: 600; color: #FBF7FF;">
      <button type="button" style="border: 0; border-radius: 14px; padding: 0 18px; font: inherit; font-weight: 800; background: #FBF7FF; color: #0E0B1A;">Add</button>
    </form>
  </div>

  <nav aria-label="Sections" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; padding-bottom: 14px; box-sizing: border-box; background: rgba(14,11,26,0.92); border-top: 1px solid rgba(255,255,255,0.1); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">

    </a>
    <a href="Routine.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #FBF7FF; text-decoration: none; font-size: 12px; font-weight: 800;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>Routine
      <span style="width: 18px; height: 4px; border-radius: 3px; background: linear-gradient(90deg, #FF4D8D, #FFD93D);"></span>
