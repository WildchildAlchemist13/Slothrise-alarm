<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding: pick a mission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Manrope:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FFD93D}a:hover{color:#FFE680}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 60px 22px 34px; background: #0E0B1A; color: #FBF7FF; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px; overflow: hidden; position: relative;">
  <div style="position: absolute; width: 360px; height: 360px; border-radius: 50%; right: -160px; top: -150px; background: #FF7A59; filter: blur(80px); opacity: 0.5;"></div>
  <div style="display: flex; justify-content: space-between; align-items: center; position: relative;">
    <div style="display: flex; gap: 6px;">
      <span style="width: 26px; height: 6px; border-radius: 3px; background: #FFD93D;"></span>
      <span style="width: 26px; height: 6px; border-radius: 3px; background: #FFD93D;"></span>
      <span style="width: 26px; height: 6px; border-radius: 3px; background: #272043;"></span>
    </div>
    <button type="button" style="background: none; border: 0; color: #B7AECF; font: inherit; font-weight: 800; font-size: 14px; padding: 8px;">Skip</button>
  </div>
  <div style="display: flex; flex-direction: column; gap: 8px; position: relative;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: #FFD93D;">Step 2 of 3</span>
    <h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 800; font-size: 40px; line-height: 1; letter-spacing: -0.04em;">What gets your brain out of bed?</h1>
    <p style="margin: 0; font-size: 15px; color: #B7AECF; line-height: 1.5;">The alarm only stops when you finish this. You can change it for each alarm.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; position: relative;">
    <button type="button" aria-pressed="true" style="text-align: left; font: inherit; color: inherit; border: 2px solid #FFD93D; background: rgba(255,217,61,0.12); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFD93D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"></path></svg>
      <b style="font-size: 17px;">Math</b>
      <span style="font-size: 13px; color: #B7AECF;">3 quick sums. Wakes the thinking part.</span>
    </button>
    <button type="button" aria-pressed="false" style="text-align: left; font: inherit; color: inherit; border: 2px solid transparent; background: #1A1530; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#3EE6B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
      <b style="font-size: 17px;">Memory</b>
      <span style="font-size: 13px; color: #B7AECF;">Repeat a glowing tile pattern.</span>
    </button>
    <button type="button" aria-pressed="false" style="text-align: left; font: inherit; color: inherit; border: 2px solid transparent; background: #1A1530; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF4D8D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
      <b style="font-size: 17px;">Type</b>
      <span style="font-size: 13px; color: #B7AECF;">Type your morning mantra exactly.</span>
    </button>
    <button type="button" aria-pressed="false" style="text-align: left; font: inherit; color: inherit; border: 2px solid transparent; background: #1A1530; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 150px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FF8A3D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="4"></circle><circle cx="12" cy="12" r="1"></circle></svg>
      <b style="font-size: 17px;">Tap</b>
      <span style="font-size: 13px; color: #B7AECF;">Catch a moving target 15 times.</span>
    </button>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; position: relative;">
    <a href="Home.dc.html" style="height: 58px; border-radius: 18px; background: linear-gradient(120deg, #FF4D8D, #FF8A3D 55%, #FFD93D); color: #1B0F24; font-family: 'Fredoka', sans-serif; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; text-decoration: none;">Continue with Math</a>
    <span style="text-align: center; font-size: 13px; color: #B7AECF;">Next: set your first wake-up time</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
