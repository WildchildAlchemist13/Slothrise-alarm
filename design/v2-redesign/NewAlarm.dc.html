<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New alarm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#2B0A22}a:hover{color:#6B5464}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 52px 20px 26px; background: #FFF8EE; color: #2B0A22; font-family: Nunito, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px;">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <a href="HomeDay.dc.html" style="font-weight: 800; font-size: 16px; text-decoration: none; padding: 8px 0;">Cancel</a>
    <h1 style="margin: 0; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px;">New alarm</h1>
    <a href="Ringing.dc.html" style="font-weight: 800; font-size: 16px; text-decoration: none; padding: 8px 0; color: #C2410C;">Preview</a>
  </div>

  <div style="background: #FFFFFF; border: 2.5px solid #2B0A22; border-radius: 26px; box-shadow: 0 4px 0 #2B0A22; padding: 6px 0; display: flex; justify-content: center; align-items: center; gap: 10px; font-family: Fredoka, sans-serif; font-weight: 700; position: relative;">
    <div style="position: absolute; left: 14px; right: 14px; top: 50%; height: 64px; margin-top: -32px; border-radius: 16px; background: #FFE1D2;"></div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.05;"><span style="font-size: 26px; color: #C9B7C3;">5</span><span style="font-size: 58px;">6</span><span style="font-size: 26px; color: #C9B7C3;">7</span></div>
    <span style="position: relative; font-size: 52px;">:</span>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.05;"><span style="font-size: 26px; color: #C9B7C3;">25</span><span style="font-size: 58px;">30</span><span style="font-size: 26px; color: #C9B7C3;">35</span></div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; line-height: 1.6; margin-left: 6px;"><span style="font-size: 24px;">am</span><span style="font-size: 20px; color: #C9B7C3;">pm</span></div>
  </div>
  <span style="font-size: 13.5px; font-weight: 700; color: #6B5464; text-align: center; margin-top: -4px;">Rings in 8 h 49 min. In bed by 10:15 pm for 8 hours.</span>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #6B5464;">HOW SHOULD I WAKE YOU?</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <button type="button" aria-pressed="true" style="font: inherit; color: inherit; text-align: left; background: #E4F4FD; border: 3px solid #2B0A22; border-radius: 20px; box-shadow: 0 4px 0 #2B0A22; padding: 12px; display: flex; flex-direction: column; gap: 4px; position: relative;">
        <span style="position: absolute; right: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%; background: #2B0A22; display: grid; place-items: center;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFF8EE" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B0A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 6v3M5.6 10.6l2 2M18.4 10.6l-2 2"></path></svg>
        <b style="font-family: Fredoka, sans-serif; font-size: 18px;">Gentle</b>
        <span style="font-size: 13px; color: #4A3443; font-weight: 600;">A slow sunrise, then a mission if you stay in bed</span>
      </button>
      <button type="button" aria-pressed="false" style="font: inherit; color: inherit; text-align: left; background: #FFFFFF; border: 2.5px solid #2B0A22; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2B0A22" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
        <b style="font-family: Fredoka, sans-serif; font-size: 18px;">Mission</b>
        <span style="font-size: 13px; color: #6B5464; font-weight: 600;">Straight to the task. No mercy.</span>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #6B5464;">BACKUP MISSION</span>
    <div style="display: flex; gap: 8px; font-size: 14px; font-weight: 800;">
      <button type="button" aria-pressed="false" style="font: inherit; flex: 1; height: 44px; border-radius: 14px; border: 0; background: #F1E4D3; color: #2B0A22;">Math</button>
      <button type="button" aria-pressed="false" style="font: inherit; flex: 1; height: 44px; border-radius: 14px; border: 0; background: #F1E4D3; color: #2B0A22;">Memory</button>
      <button type="button" aria-pressed="false" style="font: inherit; flex: 1; height: 44px; border-radius: 14px; border: 0; background: #F1E4D3; color: #2B0A22;">Type</button>
      <button type="button" aria-pressed="true" style="font: inherit; flex: 1; height: 44px; border-radius: 14px; border: 0; background: #2B0A22; color: #FFF8EE;">Tap</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #6B5464;">REPEAT</span>
    <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 15px;">
      <button type="button" aria-label="Sunday" aria-pressed="false" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #D9C7B3; background: #FFF8EE; color: #6B5464;">S</button>
      <button type="button" aria-label="Monday" aria-pressed="true" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #2B0A22; background: #FF7A45; color: #2B0A22;">M</button>
      <button type="button" aria-label="Tuesday" aria-pressed="false" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #D9C7B3; background: #FFF8EE; color: #6B5464;">T</button>
      <button type="button" aria-label="Wednesday" aria-pressed="true" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #2B0A22; background: #FF7A45; color: #2B0A22;">W</button>
      <button type="button" aria-label="Thursday" aria-pressed="false" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #D9C7B3; background: #FFF8EE; color: #6B5464;">T</button>
      <button type="button" aria-label="Friday" aria-pressed="true" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #2B0A22; background: #FF7A45; color: #2B0A22;">F</button>
      <button type="button" aria-label="Saturday" aria-pressed="false" style="font: inherit; width: 42px; height: 42px; border-radius: 50%; border: 2.5px solid #D9C7B3; background: #FFF8EE; color: #6B5464;">S</button>
    </div>
  </div>

  <div style="background: #F1E4D3; border-radius: 20px; display: flex; flex-direction: column;">
    <button type="button" style="font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px solid #E4D3BF; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; text-align: left;"><span style="font-weight: 800;">Label</span><span style="font-weight: 700; color: #6B5464;">Gym before the chaos ›</span></button>
    <button type="button" style="font: inherit; color: inherit; background: none; border: 0; border-bottom: 2px solid #E4D3BF; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; text-align: left;"><span style="font-weight: 800;">Sound</span><span style="font-weight: 700; color: #6B5464;">Soft bells ›</span></button>
    <div style="padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px;">
      <div style="display: flex; flex-direction: column;"><span style="font-weight: 800;">Allow snooze</span><span style="font-size: 12.5px; font-weight: 700; color: #6B5464;">Each snooze puts your streak at risk</span></div>
      <button type="button" role="switch" aria-checked="false" aria-label="Allow snooze" style="width: 60px; height: 36px; border-radius: 999px; border: 2.5px solid #2B0A22; background: #FFF8EE; position: relative; flex: none;"><span style="position: absolute; left: 3px; top: 3px; width: 25px; height: 25px; border-radius: 50%; background: #FFFFFF; border: 2.5px solid #2B0A22; box-sizing: border-box;"></span></button>
    </div>
  </div>

  <a href="HomeDay.dc.html" style="margin-top: auto; height: 58px; border-radius: 18px; border: 2.5px solid #2B0A22; background: #FF7A45; box-shadow: 0 4px 0 #2B0A22; display: flex; align-items: center; justify-content: center; text-decoration: none; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 19px;">Save alarm</a>
</div>
</x-dc>

</html>
